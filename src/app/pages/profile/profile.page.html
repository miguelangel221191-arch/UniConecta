<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Perfil del Estudiante</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding" style="--background: #121212; color: white;">

  <div style="text-align: center; margin-top: 20px; margin-bottom: 20px;">
    <h2>Mi Cuenta UAPA</h2>
    <p style="color: #aaa;">Información institucional del estudiante</p>
  </div>

  <div style="max-width: 500px; margin: 0 auto; background: #1e1e1e; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.5);">
    
    <div style="text-align: center; margin-bottom: 20px;">
      <div style="width: 80px; height: 80px; background: #333; border-radius: 50%; margin: 0 auto 15px auto; display: flex; align-items: center; justify-content: center; font-size: 32px; color: #fff;">
        👤
      </div>
      
      <!-- El badge cambia de color y texto automáticamente según el internet -->
      <ion-badge [color]="colorBadge" style="margin-bottom: 10px;">{{ estadoRed }}</ion-badge>
      
      <h2 style="margin: 5px 0; color: white;">{{ nombreEstudiante }}</h2>
      <p style="color: #3880ff; margin: 0;">Ingeniería de Software</p>
    </div>

    <div style="margin-top: 25px;">
      <label style="display: block; font-size: 12px; color: #888; margin-bottom: 5px;">Matrícula</label>
      <div style="background: #2a2a2a; padding: 12px; border-radius: 8px; color: white; margin-bottom: 15px;">
        2023-00123
      </div>

      <label style="display: block; font-size: 12px; color: #888; margin-bottom: 5px;">Correo Institucional</label>
      <div style="background: #2a2a2a; padding: 12px; border-radius: 8px; color: white;">
        {{ correoEstudiante }}
      </div>
    </div>

    <div style="margin-top: 30px;">
      
      <ion-button expand="block" color="danger" (click)="cerrarSesion()">
        CERRAR SESIÓN
      </ion-button>
    </div>

  </div>

</ion-content>
