<ion-header>
<ion-toolbar color="primary">
<ion-title>
Mi Ubicación GPS
</ion-title>
</ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

<ion-button
expand="block"
color="success"
(click)="obtenerUbicacion()">

Obtener Ubicación

</ion-button>

<ion-card>

<ion-card-header>

<ion-card-title>

Datos GPS

</ion-card-title>

</ion-card-header>

<ion-card-content>

<p>
Latitud: {{ latitud }}
</p>

<p>
Longitud: {{ longitud }}
</p>

</ion-card-content>

</ion-card>

<div id="map"></div>

<ion-button
  expand="block"
  color="warning"
  (click)="compartirUbicacion()">

  Compartir Ubicación

</ion-button>

<ion-item>
  <ion-input
    placeholder="Buscar lugar..."
    [(ngModel)]="busqueda">
  </ion-input>
</ion-item>

<ion-button
  expand="block"
  color="primary"
  (click)="buscarLugar()">

  Buscar Lugar

</ion-button>

</ion-content>
