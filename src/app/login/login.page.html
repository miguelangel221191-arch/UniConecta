<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>UniConecta - Iniciar Sesión</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding" style="--background: #121212; color: white;">
  
  <div style="text-align: center; margin-top: 40px; margin-bottom: 20px;">
    <h2>Bienvenido a UniConecta</h2>
    <p style="color: #aaa;">Ingrese sus credenciales institucionales</p>
  </div>

  <div style="max-width: 400px; margin: 0 auto; background: #1e1e1e; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.5);">
    
    <div style="margin-bottom: 20px;">
      <label style="display: block; margin-bottom: 8px; font-size: 14px; color: #bbb;">Correo Institucional</label>
      <ion-input #inputCorreo placeholder="correo@uapa.edu.do" type="email" style="background: #2a2a2a; color: white; padding: 12px; border-radius: 8px; border: 1px solid #444;"></ion-input>
    </div>

    <div style="margin-bottom: 25px;">
      <label style="display: block; margin-bottom: 8px; font-size: 14px; color: #bbb;">Contraseña</label>
      <ion-input #inputClave placeholder="********" type="password" style="background: #2a2a2a; color: white; padding: 12px; border-radius: 8px; border: 1px solid #444;"></ion-input>
    </div>

    <!-- Le pasamos el valor directo de los inputs a la función -->
    <ion-button expand="block" color="primary" (click)="onLogin(inputCorreo.value, inputClave.value)" style="height: 48px; font-weight: bold;">
      Iniciar Sesión
    </ion-button>

  </div>

</ion-content>
