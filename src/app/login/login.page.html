<ion-header>
<ion-toolbar color="primary">
<ion-title>
UniConecta
</ion-title>
</ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

<div class="login-container">

<h1>Bienvenido</h1>

<p>
Plataforma para grupos de estudio universitarios
</p>

<ion-item>
<ion-label position="stacked">
Correo Institucional
</ion-label>

<ion-input
type="email">
</ion-input>

</ion-item>

<ion-item>
<ion-label position="stacked">
Contraseña
</ion-label>

<ion-input
type="password">
</ion-input>

</ion-item>

<ion-button
expand="block"
color="primary"
(click)="iniciarSesion()">

Iniciar Sesión

</ion-button>

</div>

</ion-content>
