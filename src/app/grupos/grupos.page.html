<ion-header>
<ion-toolbar color="primary">
<ion-title>
Mis Grupos
</ion-title>
</ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

<h2>Grupos Académicos</h2>

<p>
Administra tus grupos de estudio.
</p>

<ion-card *ngFor="let grupo of grupos">

<ion-card-header>

<ion-card-title>
{{ grupo }}
</ion-card-title>

</ion-card-header>

<ion-card-content>
Grupo activo de UniConecta.
</ion-card-content>

</ion-card>

<ion-button
expand="block"
color="success"
(click)="crearGrupo()">

Crear Grupo

</ion-button>

</ion-content>
